services:

  # =========================
  # PostgreSQL
  # =========================
  postgres:
    image: postgres:16-alpine
    container_name: physics-postgres

    environment:
      POSTGRES_USER: physics_user
      POSTGRES_PASSWORD: physics123
      POSTGRES_DB: physics_db

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./k8s/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physics_user -d physics_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s


  # =========================
  # Auth Service
  # =========================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile

    image: physics-auth:v1
    container_name: physics-auth

    environment:
      PORT: 3001
      NODE_ENV: production

      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_USER: physics_user
      POSTGRES_PASSWORD: physics123
      POSTGRES_DB: physics_db

      JWT_SECRET: local-compose-secret

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # =========================
  # Student Service
  # =========================
  student-service:
    build:
      context: ./services/student-service
      dockerfile: Dockerfile

    image: physics-student:v1
    container_name: physics-student

    environment:
      PORT: 3002
      NODE_ENV: production

      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_USER: physics_user
      POSTGRES_PASSWORD: physics123
      POSTGRES_DB: physics_db

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - student_uploads:/app/uploads

    networks:
      - backend

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # =========================
  # Content Service
  # =========================
  content-service:
    build:
      context: ./services/content-service
      dockerfile: Dockerfile

    image: physics-content:v1
    container_name: physics-content

    environment:
      PORT: 3003
      NODE_ENV: production

      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_USER: physics_user
      POSTGRES_PASSWORD: physics123
      POSTGRES_DB: physics_db

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # =========================
  # Progress Service
  # =========================
  progress-service:
    build:
      context: ./services/progress-service
      dockerfile: Dockerfile

    image: physics-progress:v1
    container_name: physics-progress

    environment:
      PORT: 3004
      NODE_ENV: production

      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_USER: physics_user
      POSTGRES_PASSWORD: physics123
      POSTGRES_DB: physics_db

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - backend

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


  # =========================
  # API Gateway
  # =========================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile

    image: physics-gateway:v1
    container_name: physics-gateway

    environment:
      PORT: 8080

      AUTH_SERVICE: http://auth-service:3001
      STUDENT_SERVICE: http://student-service:3002
      CONTENT_SERVICE: http://content-service:3003
      PROGRESS_SERVICE: http://progress-service:3004

    depends_on:
      auth-service:
        condition: service_healthy

      student-service:
        condition: service_healthy

      content-service:
        condition: service_healthy

      progress-service:
        condition: service_healthy

    networks:
      - frontend-net
      - backend
    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================
  # Frontend
  # =========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: physics-frontend:v1
    container_name: physics-frontend

    environment:
      PORT: 3000
      NODE_ENV: production

      GATEWAY_URL: http://gateway:8080
      SESSION_SECRET: local-compose-session-secret

    ports:
      - "3000:3000"

    depends_on:
      gateway:
        condition: service_healthy

    networks:
      - frontend-net

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


# =========================
# Networks
# =========================
networks:

  frontend-net:
    driver: bridge

  backend:
    driver: bridge
    internal: true


# =========================
# Persistent Volumes
# =========================
volumes:

  postgres_data:

  student_uploads:
