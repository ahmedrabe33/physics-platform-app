name: Flutter CI/CD

on:
  push:
    branches:
      - flutter

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: stable
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=http://54.174.133.163:8081

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: physics-platform-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="flutter-v1.0.${{ github.run_number }}"

          gh release create "$TAG" \
            build/app/outputs/flutter-apk/app-release.apk \
            --title "Physics Platform $TAG" \
            --notes "Automated Flutter Android release."
